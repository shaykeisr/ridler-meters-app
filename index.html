<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>נתוני צריכת משכירים – משפחת רידלר</title>
<meta name="theme-color" content="#0f6e5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6e5a'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece5; --text:#1c1f24; --muted:#575d66;
  --border:#d6d1c6; --accent:#0f6e5a; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --elec:#d98a00; --elec-ink:#8a5200; --elec-soft:#fff1d6;
  --water:#1f6fc5; --water-ink:#17589e; --water-soft:#e1eefc;
  --danger:#b42318; --danger-soft:#fde7e5; --ok:#157347;
  --meter-bg:#1f2328; --meter-fg:#ffd166; --focus:#2563eb; --grid:#e3dfd6;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111316; --surface:#1a1d22; --surface-2:#23272e; --text:#eceef1; --muted:#a7adb7;
    --border:#363c46; --accent:#3fb59a; --accent-ink:#06231c; --accent-soft:#16352e;
    --elec:#f2a93b; --elec-ink:#f6c27a; --elec-soft:#3a2a10;
    --water:#5aa9f5; --water-ink:#8ec4f8; --water-soft:#132a42;
    --danger:#f28b82; --danger-soft:#3b1a18; --ok:#6fcf97;
    --meter-bg:#0b0d10; --meter-fg:#ffd166; --focus:#7aa7ff; --grid:#2c313a;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1a1d22; --surface-2:#23272e; --text:#eceef1; --muted:#a7adb7;
  --border:#363c46; --accent:#3fb59a; --accent-ink:#06231c; --accent-soft:#16352e;
  --elec:#f2a93b; --elec-ink:#f6c27a; --elec-soft:#3a2a10;
  --water:#5aa9f5; --water-ink:#8ec4f8; --water-soft:#132a42;
  --danger:#f28b82; --danger-soft:#3b1a18; --ok:#6fcf97;
  --meter-bg:#0b0d10; --meter-fg:#ffd166; --focus:#7aa7ff; --grid:#2c313a;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5;overflow-x:clip;min-height:100vh}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border)}
.titles{flex:1;min-width:0}
.titles h1{font-size:1.1rem;font-weight:700;line-height:1.25}
.titles p{font-size:.9rem;color:var(--muted)}
.tools{display:flex;gap:6px;flex-shrink:0}
.tool{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:16px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.tool:disabled{opacity:.4;cursor:default}
.tool svg{width:22px;height:22px}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.screen-title{font-size:1.25rem;font-weight:700;margin:4px 0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.1rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mcard-elec{border-top:5px solid var(--elec)}
.mcard-water{border-top:5px solid var(--water)}
.mico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;font-size:18px}
.mcard-elec .mico{background:var(--elec-soft)} .mcard-water .mico{background:var(--water-soft)}
.muted{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.95rem;margin-bottom:12px}

.lbl{display:block;font-weight:500;margin-bottom:6px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.inp{width:100%;min-height:52px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;background:var(--surface);font-size:1.05rem}
.inp:focus{border-color:var(--focus);outline:none}
.inp.invalid{border-color:var(--danger)}
.inp-meter{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.35rem;font-weight:600;letter-spacing:.06em;direction:ltr;text-align:right}
.inp-row{display:flex;align-items:center;gap:8px}
.inp-row .inp{flex:1;min-width:0}
.unit{flex-shrink:0;min-width:3.2em;color:var(--muted);font-size:.95rem}
.meter{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;background:var(--meter-bg);color:var(--meter-fg);padding:1px 8px;border-radius:6px;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
.prevline{margin-bottom:12px;line-height:2}
.err{color:var(--danger);font-weight:500;font-size:.95rem;margin-top:6px}
.err:empty{display:none}
.err-box{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-weight:500;margin-bottom:14px}
.err-box:empty{display:none}

.live{margin-top:12px}
.live:empty{display:none}
.live-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.live-grid div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.live-grid span{display:block;font-size:.8rem;color:var(--muted)}
.live-grid b{font-size:1rem;font-weight:700;overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--border);background:var(--surface-2);font-weight:500;cursor:pointer;text-decoration:none;text-align:center;line-height:1.3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-outline{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.big{width:100%;min-height:58px;font-size:1.15rem}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff;font-weight:700}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row .btn{flex:1 1 140px}
.btn-sm{min-height:44px;padding:6px 14px;font-size:.95rem}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:500;cursor:pointer;padding:6px 4px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700;outline:2px solid var(--accent)}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.banner p{flex:1 1 200px}

/* summary */
.sum-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.rows{display:flex;flex-direction:column}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.r:last-child{border-bottom:0}
.r .k{color:var(--muted)}
.r .how{display:block;font-size:.8rem;opacity:.85;direction:ltr;unicode-bidi:isolate;text-align:right}
.r .v{font-weight:500;text-align:left;overflow-wrap:anywhere}
.r.total{border-top:2px solid var(--border);border-bottom:0;margin-top:4px;padding-top:12px}
.r.total .k{color:var(--text);font-weight:700}
.r.total .v{font-weight:700;font-size:1.15rem}
.dates{font-size:.95rem;color:var(--muted);margin-bottom:8px}
.grand{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}
.grand .k{font-size:1rem;font-weight:500}
.grand .v{font-size:2rem;font-weight:700;line-height:1.2}
.grand .sub{font-size:.9rem;opacity:.9;margin-top:4px}
.empty{text-align:center;padding:28px 16px}
.empty p{margin-bottom:14px}

/* charts */
.chart-wrap{position:relative;width:100%}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axis-t{fill:var(--muted);font-size:11px;font-family:"Rubik",system-ui,sans-serif}
.bar{cursor:pointer}
.bar-elec{fill:var(--elec)} .bar-water{fill:var(--water)}
.bar.sel{stroke:var(--text);stroke-width:2}
.bar:focus{outline:none;stroke:var(--focus);stroke-width:3}
.tip{position:absolute;background:var(--text);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:.85rem;line-height:1.35;pointer-events:none;white-space:nowrap;z-index:2}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem;table-layout:fixed}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
th{color:var(--muted);font-weight:500;font-size:.85rem}
th:first-child,td:first-child{width:32%}
th:last-child,td:last-child{width:28%}

/* history */
.hitem{padding:12px 0;border-bottom:1px solid var(--border)}
.hitem:last-child{border-bottom:0}
.hline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hdate{font-weight:700}
.hmeta{font-size:.92rem;color:var(--muted);margin-top:4px}
.hbtns{display:flex;gap:8px;margin-top:10px}
.hbtns .btn{flex:1}
.confirm{background:var(--danger-soft);border-radius:12px;padding:12px;margin-top:10px}
.confirm p{font-weight:500;margin-bottom:10px;color:var(--text)}
.edit-box{background:var(--surface-2);border-radius:12px;padding:12px;margin-top:10px}

/* settings */
.preview{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.95rem}
.preview b{white-space:nowrap}
.scale-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.scale-row .val{min-width:4em;text-align:center;font-weight:700}
.sep{height:1px;background:var(--border);margin:14px 0}
.explain{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.explain summary{cursor:pointer;font-weight:500;min-height:32px;display:flex;align-items:center}
.explain p{margin-top:8px}

/* Israeli date field + Hebrew calendar */
.datef{display:flex;gap:8px;align-items:stretch}
.datef .inp{flex:1;min-width:0;text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.cal-btn{flex-shrink:0;width:52px;border:2px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;display:grid;place-items:center;padding:0}
.cal-btn svg{width:24px;height:24px}
.cal-pop{margin-top:8px;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:10px;font-size:16px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-size:17px}
.cal-nav{width:44px;height:44px;border:0;border-radius:10px;background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.cal-nav svg{width:22px;height:22px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;direction:rtl}
.cal-wd{text-align:center;font-size:13px;color:var(--muted);padding:4px 0}
.cal-day{height:40px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:16px}
.cal-day:hover{background:var(--surface-2)}
.cal-day.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal-day.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-foot{display:flex;gap:8px;margin-top:8px}
.cal-foot .btn{flex:1}
.saved-flag{font-size:.85rem;color:var(--ok);font-weight:500;margin-inline-start:auto;opacity:0;transition:opacity .3s}
.saved-flag.on{opacity:1}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--muted);cursor:pointer;padding:6px 2px;line-height:1.15}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button[aria-current="page"] svg{stroke-width:2.4}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="titles">
    <h1>נתוני צריכת משכירים</h1>
    <p>משפחת רידלר</p>
  </div>
  <div class="tools">
    <button class="tool" data-action="fontDec" id="font-dec" aria-label="הקטנת הכתב" title="הקטנת הכתב">A−</button>
    <button class="tool" data-action="fontInc" id="font-inc" aria-label="הגדלת הכתב" title="הגדלת הכתב">A+</button>
    <button class="tool" data-action="theme" id="theme-btn" aria-label="מעבר למצב כהה" title="מעבר למצב כהה"></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="nav" aria-label="ניווט ראשי">
  <div class="nav-in">
    <button data-action="tab" data-tab="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>קריאה חדשה</button>
    <button data-action="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>סיכום</button>
    <button data-action="tab" data-tab="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>גרפים</button>
    <button data-action="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>היסטוריה</button>
    <button data-action="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>הגדרות</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restore-file" accept="application/json,.json,text/plain" class="vh" tabindex="-1" aria-hidden="true">

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY = 'ridler-meters-v1';
const PKEY = 'ridler-meters-prefs';
/* defaults from the latest bills: electricity 08/07–07/09/2026, water 31/07–30/09/2026 */
const DEFAULTS = {
  elec:  { rate: 53.83, extra: 0,    vat: 18, kvaAmount: 18.18, fixedAmount: 55.22, fixedDays: 62, share: 50 },
  water: { rate: 8.51,  extra: 0,    vat: 0,  kvaAmount: 0,     fixedAmount: 0,     fixedDays: 61, share: 100 }
};
/* last readings printed on those bills, offered as the starting point on first use */
const BILL_START = {
  elec:  { date: '2026-09-07', value: 52717 },
  water: { date: '2026-09-30', value: 848.76 }
};
const HEB_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const METERS = {
  elec:  { name: 'חשמל', unit: 'קוט"ש', icon: '⚡' },
  water: { name: 'מים',  unit: 'מ"ק',   icon: '💧' }
};
const MKEYS = ['elec', 'water'];
const SCALES = [0.9, 1, 1.1, 1.2, 1.35, 1.55];
const DAY = 86400000;

const FIELDS = {
  elec: [
    { k: 'rate',        label: 'מחיר לקוט"ש',                   unit: 'אג׳',   hint: 'כפי שמופיע בחשבון, לפני מע"מ' },
    { k: 'vat',         label: 'מע"מ',                           unit: '%',     hint: 'כפי שמופיע בחשבון', max: 100 },
    { k: 'kvaAmount',   label: 'תשלום בגין הספק (KVA)',          unit: '₪',     hint: 'סה"כ השורה "תשלום בגין הספק" בחשבון, לפני מע"מ' },
    { k: 'fixedAmount', label: 'תשלום קבוע',                     unit: '₪',     hint: 'סה"כ השורה "תשלום קבוע" (חלוקה + אספקה), לפני מע"מ' },
    { k: 'fixedDays',   label: 'מספר ימים בחשבון',               unit: 'ימים',  hint: 'אורך תקופת החשבון', positive: true },
    { k: 'share',       label: 'חלק השוכר בהספק ובתשלום הקבוע',  unit: '%',     hint: 'כמה אחוז מהתשלומים האלה השוכר משלם', max: 100 }
  ],
  water: [
    { k: 'rate',        label: 'מחיר למ"ק',                      unit: '₪',     hint: 'כפי שמופיע בחשבון' },
    { k: 'extra',       label: 'תוספת למ"ק',                     unit: '₪',     hint: 'אם אין – להשאיר 0' },
    { k: 'vat',         label: 'מע"מ',                           unit: '%',     hint: 'אם המחיר כבר כולל מע"מ – להשאיר 0', max: 100 },

async function copyText(text) {

const MODES = [

function modeVal(p, mode) { return mode === 'units' ? p.units : mode === 'money' ? p.total : p.perDay; }
function modeFmt(v, m, mode) {

  return `${fmtNum(v, mode === 'units' ? 3 : 2)} ${METERS[m].unit}${mode === 'perday' ? ' ליום' : ''}`;
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;

}
const CH = { W: 340, H: 210, L: 46, R: 8, T: 14, B: 34 };
function chartSVG(m, ps, mode) {
  const vals = ps.map(p => modeVal(p, mode));
  const max = niceMax(Math.max(...vals));
  const n = ps.length, plotW = CH.W - CH.L - CH.R, plotH = CH.H - CH.T - CH.B;
  const cw = plotW / n, bw = Math.min(cw * 0.62, 48);

  for (let g = 0; g <= 4; g++) {

    s += `<line class="gridline" x1="${CH.L}" x2="${CH.W - CH.R}" y1="${y}" y2="${y}"/>`;

  }

    s += `<rect class="bar bar-${m}${sel ? ' sel' : ''}" data-action="barTip" data-m="${m}" data-i="${i}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" tabindex="0" role="button" aria-label="${esc(fmtD(p.cur.date) + ': ' + modeFmt(v, m, mode))}"/>`;
    /* invisible full-height hit area so short bars are easy to tap */
    s += `<rect data-action="barTip" data-m="${m}" data-i="${i}" x="${CH.L + i * cw}" y="${CH.T}" width="${cw}" height="${plotH}" fill="transparent" style="cursor:pointer"/>`;
    if (i % every === 0 || i === n - 1) s += `<text class="axis-t" x="${x + bw / 2}" y="${CH.H - CH.B + 16}" text-anchor="middle">${fmtDShort(p.cur.date)}</text>`;
  });
  s += '</svg>';
  let tip = '';
  if (state.tip && state.tip.m === m && ps[state.tip.i]) {
    const i = state.tip.i, p = ps[i], v = vals[i];
    const h = Math.max(v / max * plotH, v > 0 ? 2 : 0);

    const p = state.pendingRestore;
    h += `<div class="confirm"><p>בקובץ יש ${p.readings.elec.length} קריאות חשמל ו-${p.readings.water.length} קריאות מים${p.lastBackup ? ` (גיבוי מ-${fmtDateTime(p.lastBackup)})` : ''}.<br>לשחזר? הנתונים הנוכחיים בטלפון יוחלפו בנתונים מהקובץ.</p>
      <div class="hbtns"><button class="btn primary" data-action="restoreConfirm">כן, לשחזר</button><button class="btn" data-action="restoreCancel">ביטול</button></div></div>`;
  }
  h += `<p class="hint" style="margin-top:12px">הנתונים נשמרים רק בטלפון הזה ובדפדפן הזה. חשוב לפתוח את האפליקציה תמיד מאותו אייקון, ולשמור גיבוי מדי פעם.</p></section>`;
  h += `<section class="card"><h2>תצוגה</h2>
    <p class="lbl">גודל הכתב</p>
    <div class="scale-row"><button class="tool" id="scale-dec" data-action="fontDec" aria-label="הקטנת הכתב">A−</button><span class="val" id="scale-val"></span><button class="tool" id="scale-inc" data-action="fontInc" aria-label="הגדלת הכתב">A+</button></div>
    <p class="lbl">מצב תצוגה: <span id="theme-state"></span></p>
    <button class="btn" style="width:100%" data-action="theme">מעבר בין בהיר לכהה</button></section>`;
  h += `<section class="card"><h2>מחיקת נתונים</h2>`;
  if (state.wipeStep === 0) h += `<button class="btn danger-outline" style="width:100%" data-action="wipeStart">מחיקת כל הנתונים</button>`;
  else if (state.wipeStep === 1) h += `<div class="confirm"><p>למחוק את כל הנתונים? כל הקריאות, שם השוכר והתעריפים יימחקו מהטלפון.</p>
      <div class="hbtns"><button class="btn danger" data-action="wipeNext">כן, להמשיך</button><button class="btn" data-action="wipeCancel">ביטול</button></div></div>`;
  else h += `<div class="confirm"><p>בטוח? אי אפשר לבטל את המחיקה. ${data.lastBackup ? '' : 'עדיין לא נשמר גיבוי!'}</p>
      <div class="hbtns"><button class="btn danger" data-action="wipeConfirm">מחיקה סופית</button><button class="btn" data-action="wipeCancel">ביטול</button></div></div>`;
  h += '</section>';
  if (!totalReadings()) {
    h += `<section class="card"><h2>לבדיקה בלבד</h2><p class="hint" style="margin-bottom:12px">טוען את הקריאות מהחשבונות האחרונים כדי לראות איך האפליקציה עובדת. אפשר למחוק אחר כך.</p>
      <button class="btn" style="width:100%" data-action="loadSample">טעינת נתוני דוגמה</button></section>`;
  }
  return h;
}
function updatePreview(m) {
  const el = $(`prev-${m}`); if (!el) return;
  const s = data.settings[m], up = unitPrice(m, s), M = METERS[m];
  const fixedTotal = s.kvaAmount + s.fixedAmount;
  const perDay = s.fixedDays > 0 ? fixedTotal / s.fixedDays * s.share / 100 : 0;
  el.innerHTML = `מחיר סופי ל${M.unit} כולל מע"מ: <b><bdi>${fmtNum(up * (1 + s.vat / 100), 4)} ₪</bdi></b>`
    + (fixedTotal > 0 ? `<br>חלק השוכר בתשלומים הקבועים: <b><bdi>${fmtNum(perDay, 4)} ₪</bdi></b> ליום (לפני מע"מ)` : '');
}
const flagTimers = {};
function onSettingInput(el) {
  const m = el.dataset.m, k = el.dataset.k, f = FIELDS[m].find(x => x.k === k);
  const n = readNum(el.value), errEl = $(`${el.id}-err`);
  let e = '';
  if (n.empty || n.bad) e = 'יש להזין מספר בלבד';
  else if (f.max != null && n.value > f.max) e = `המספר צריך להיות בין 0 ל-${f.max}`;
  else if (f.positive && !(n.value > 0)) e = 'המספר צריך להיות גדול מ-0';
  errEl.textContent = e; el.classList.toggle('invalid', !!e);
  if (e) return;
  data.settings[m][k] = n.value;
  if (saveData()) {
    updatePreview(m);
    const fl = $(`flag-${m}`); if (fl) { fl.classList.add('on'); clearTimeout(flagTimers[m]); flagTimers[m] = setTimeout(() => fl.classList.remove('on'), 1500); }
  }
}

/* ---------- backup ---------- */
function backupName() { return `ridler-backup-${todayISO()}.json`; }
function downloadFile(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function stampBackup() { const prevStamp = data.lastBackup; data.lastBackup = new Date().toISOString(); saveData(); return prevStamp; }
function backupDownload() {
  stampBackup();
  downloadFile(backupName(), JSON.stringify(data, null, 2));
  toast('קובץ הגיבוי נשמר בהורדות ✓');
  render();
}
async function backupShare() {
  const prevStamp = stampBackup();
  const text = JSON.stringify(data, null, 2);
  let file = null;
  try { file = new File([text], backupName(), { type: 'application/json' }); } catch (e) { /* old browser */ }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'גיבוי נתוני צריכה – משפחת רידלר' }); toast('הגיבוי נשלח ✓'); }
    catch (e) {
      if (e && e.name === 'AbortError') { data.lastBackup = prevStamp; saveData(); }
      else { downloadFile(backupName(), text); toast('לא ניתן לשתף. הקובץ נשמר בהורדות.'); }
    }
  } else {
    downloadFile(backupName(), text);
    toast('הקובץ נשמר בהורדות. אפשר לשלוח אותו ידנית.');
  }
  render();
}
$('restore-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let parsed = null;
    try { parsed = JSON.parse(rd.result); } catch (err) { /* invalid */ }
    const ok = parsed && parsed.readings && Array.isArray(parsed.readings.elec) && Array.isArray(parsed.readings.water);
    const norm = ok ? normalize(parsed) : null;
    if (!norm) { state.pendingRestore = null; state.restoreErr = 'הקובץ שנבחר אינו קובץ גיבוי תקין'; }
    else { state.pendingRestore = norm; state.restoreErr = ''; }
    render();
    const bc = $('backup-card'); if (bc) bc.scrollIntoView({ block: 'start' });
  };
  rd.onerror = () => { state.restoreErr = 'לא ניתן לקרוא את הקובץ'; render(); };
  rd.readAsText(file);
});

/* ---------- sample data ---------- */
function loadSample() {
  const te = { ...data.settings.elec }, tw = { ...data.settings.water };
  const mk = (date, value, t) => ({ id: uid(), date, value, tariff: { ...t } });
  data.settings.tenantName = data.settings.tenantName || 'שוכר לדוגמה';
  data.readings.elec = [mk('2026-07-07', 49680, te), mk('2026-07-31', 50803, te), mk('2026-08-31', 52467, te), mk('2026-09-07', 52717, te)];
  data.readings.water = [mk('2026-07-31', 784.38, tw), mk('2026-09-30', 848.76, tw)];
  if (saveData()) { toast('נתוני הדוגמה נטענו'); setTab('summary'); }
}

/* ---------- events ---------- */
const actions = {
  tab: el => setTab(el.dataset.tab),
  fontInc: () => { if (prefs.scale < SCALES.length - 1) { prefs.scale++; savePrefs(); applyPrefs(); } },
  fontDec: () => { if (prefs.scale > 0) { prefs.scale--; savePrefs(); applyPrefs(); } },
  theme: () => { prefs.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; savePrefs(); applyPrefs(); },
  nrSave,
  goBackup: () => { setTab('settings'); const bc = $('backup-card'); if (bc) bc.scrollIntoView({ block: 'start' }); },
  copySummary: async () => {
    const text = summaryText(state.summaryDate, periodsAt(state.summaryDate));
    toast(await copyText(text) ? 'הסיכום הועתק ✓' : 'ההעתקה לא הצליחה');
  },
  chartMode: el => { state.chartMode = el.dataset.mode; state.tip = null; render(); },
  barTip: el => {
    const m = el.dataset.m, i = Number(el.dataset.i);
    state.tip = (state.tip && state.tip.m === m && state.tip.i === i) ? null : { m, i };
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  histMeter: el => { state.histMeter = el.dataset.m; state.editId = null; state.delId = null; render(); },
  editStart: el => { state.editId = el.dataset.id; state.delId = null; state.editErr = ''; keepScroll(); const f = $('edit-value'); if (f) f.focus(); },
  editCancel: () => { state.editId = null; state.editErr = ''; keepScroll(); },
  editSave: el => editSave(el.dataset.id),
  delStart: el => { state.delId = el.dataset.id; state.editId = null; keepScroll(); },
  delCancel: () => { state.delId = null; keepScroll(); },
  delConfirm: el => delConfirm(el.dataset.id),
  applyAllStart: () => { state.applyConfirm = true; keepScroll(); },
  applyAllCancel: () => { state.applyConfirm = false; keepScroll(); },
  applyAllConfirm: () => {
    const backup = JSON.stringify(data.readings);
    MKEYS.forEach(m => data.readings[m].forEach(r => { r.tariff = { ...data.settings[m] }; }));
    if (!saveData()) { data.readings = JSON.parse(backup); return; }
    state.applyConfirm = false; keepScroll(); toast('התעריף הוחל על כל הקריאות ✓');
  },
  backupDownload, backupShare,
  restorePick: () => { state.restoreErr = ''; $('restore-file').click(); },
  restoreCancel: () => { state.pendingRestore = null; keepScroll(); },
  restoreConfirm: () => {
    const old = data; data = state.pendingRestore;
    if (!saveData()) { data = old; return; }
    state.pendingRestore = null; state.summaryDate = null; keepScroll(); toast('הנתונים שוחזרו מהגיבוי ✓');
  },
  wipeStart: () => { state.wipeStep = 1; keepScroll(); },
  wipeNext: () => { state.wipeStep = 2; keepScroll(); },
  wipeCancel: () => { state.wipeStep = 0; keepScroll(); },
  wipeConfirm: () => {
    const old = data; data = freshData();
    if (!saveData()) { data = old; return; }
    state.wipeStep = 0; state.summaryDate = null; state.draft = newDraft();
    keepScroll(); toast('כל הנתונים נמחקו');
  },
  loadSample,
  calToggle: el => {
    const id = el.dataset.for;
    if (calState && calState.id === id) { calClose(); return; }
    calClose();
    const [y, m] = (dateVal(id) || todayISO()).split('-').map(Number);
    calState = { id, y, m: m - 1 };
    calShow();
  },
  calNav: el => {
    if (!calState) return;
    const d = new Date(Date.UTC(calState.y, calState.m + Number(el.dataset.d), 1));
    calState.y = d.getUTCFullYear(); calState.m = d.getUTCMonth();
    calShow();
  },
  calPick: el => {
    if (!calState) return;
    const inp = $(calState.id);
    calClose();
    if (!inp) return;
    inp.value = fmtD(el.dataset.iso);
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.focus();
  },
  calClose: () => calClose()
};
function keepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

document.addEventListener('click', e => {
  if (calState && !e.target.closest('.cal-pop') && !e.target.closest('.cal-btn')) calClose();
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (state.tip) { state.tip = null; keepScroll(); }
    return;
  }
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault && el.tagName !== 'A' && e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('rect.bar')) {
    e.preventDefault(); actions.barTip(e.target);
    const again = document.querySelector(`rect.bar[data-m="${e.target.dataset.m}"][data-i="${e.target.dataset.i}"]`);
    if (again) again.focus();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('date-text') && e.inputType && e.inputType.startsWith('insert')) {
    /* add the slashes while typing: 07 → 07/ , 07/09 → 07/09/ ; dots and dashes become slashes */
    let v = el.value.replace(/[.\-\s]/g, '/').replace(/[^\d\/]/g, '').replace(/\/{2,}/g, '/');
    if (/^\d{2}$/.test(v) || /^\d{1,2}\/\d{2}$/.test(v)) v += '/';
    if (/^\d{3}$/.test(v)) v = v.slice(0, 2) + '/' + v.slice(2);
    el.value = v.slice(0, 10);
  }
  if (el.classList.contains('nr')) {
    const key = el.id === 'nr-date' ? 'date' : el.id.replace(/^nr-/, '');
    state.draft[key] = el.value;
    if (el.id === 'nr-date') MKEYS.forEach(updateLive); else updateLive(el.id.split('-')[1]);
    $('nr-err').textContent = '';
  } else if (el.classList.contains('set-field')) {
    onSettingInput(el);
  } else if (el.id === 'set-tenant') {
    data.settings.tenantName = el.value; saveData();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'sum-date') { state.summaryDate = el.value; render(); }
});
/* tidy a typed date when leaving the field: 7/9/26 → 07/09/2026 */
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('date-text')) return;
  const iso = parseIL(el.value);
  if (iso && el.value !== fmtD(iso)) { el.value = fmtD(iso); el.dispatchEvent(new Event('input', { bubbles: true })); }
});

applyPrefs();
render();
})();
</script>
</body>
